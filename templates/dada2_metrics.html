<style>
    table {
        width: auto;
        border-collapse: collapse;
    }
    th, td {
        border: 1px solid #ddd;
        padding: 8px 16px;
        text-align: left;
    }
    th {
        background-color: #E89149;
        color: white;
        padding: 8px 24px;
        white-space: nowrap;
        cursor: pointer;
    }
    th .sort-arrows {
        margin-left: 5px;
        font-size: 10px;
    }
    th .sort-arrows .active {
        color: #FFD700;
    }
    tr:nth-child(even) { background-color: #f2f2f2; }
    tr:hover { background-color: #ddd; }
    .controls { margin: 10px 0; font-family: Arial, sans-serif; }
    .hidden { display: none; }
    button { padding: 5px 15px; margin: 0 5px; cursor: pointer; }
    .help-icon {
        display: inline-block;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background-color: #4CAF50;
        color: white;
        text-align: center;
        font-size: 12px;
        line-height: 16px;
        cursor: help;
        margin-left: 5px;
        position: relative;
    }
    .help-icon:hover::after {
        content: attr(data-tooltip);
        position: absolute;
        left: 20px;
        top: -5px;
        background: #333;
        color: #fff;
        padding: 5px 10px;
        border-radius: 4px;
        white-space: nowrap;
        font-size: 12px;
        z-index: 100;
    }
</style>

<h2>DADA2 QC metrics</h2>
<div class="controls">
    <label for="search">Search sample-id: </label>
    <input type="text" id="search" onkeyup="searchTable()" placeholder="Type to search...">
    &nbsp;&nbsp;
    <label for="entries">Show entries: </label>
    <select id="entries" onchange="updateTable()">
        <option value="10">10</option>
        <option value="20">20</option>
        <option value="50">50</option>
        <option value="100">100</option>
    </select>
    <span id="info"></span>
</div>
<table id="dataTable">
    <thead>
        <tr>
            {% for column in columns %}
            <th onclick="sortTable({{ loop.index0 }})">
                {{ column }}
                {% if column in dada_column_descriptions %}
                <span class="help-icon" data-tooltip="{{ dada_column_descriptions[column] }}">?</span>
                {% endif %}
                <span class="sort-arrows">
                    <span id="arrow-up-{{ loop.index0 }}">&#9650;</span>
                    <span id="arrow-down-{{ loop.index0 }}">&#9660;</span>
                </span>
            </th>
            {% endfor %}
        </tr>
    </thead>
    <tbody>
        {% for row in rows %}
        <tr>
            {% for value in row %}
            <td>{{ value }}</td>
            {% endfor %}
        </tr>
        {% endfor %}
    </tbody>
</table>
<div class="controls">
    <button onclick="prevPage()">Previous</button>
    <span id="pageInfo"></span>
    <button onclick="nextPage()">Next</button>
</div>

<script>
    var currentPage = 1;
    var sortDirection = {};

    function sortTable(colIndex) {
        var table = document.getElementById('dataTable');
        var tbody = table.querySelector('tbody');
        var rows = Array.from(tbody.querySelectorAll('tr'));

        // Toggle direction
        if (sortDirection[colIndex] === 'asc') {
            sortDirection[colIndex] = 'desc';
        } else {
            sortDirection[colIndex] = 'asc';
        }
        var dir = sortDirection[colIndex];

        rows.sort(function(a, b) {
            var aVal = a.getElementsByTagName('td')[colIndex].textContent.trim();
            var bVal = b.getElementsByTagName('td')[colIndex].textContent.trim();
            var aNum = parseFloat(aVal);
            var bNum = parseFloat(bVal);

            if (!isNaN(aNum) && !isNaN(bNum)) {
                return dir === 'asc' ? aNum - bNum : bNum - aNum;
            }
            return dir === 'asc' ? aVal.localeCompare(bVal) : bVal.localeCompare(aVal);
        });

        rows.forEach(function(row) { tbody.appendChild(row); });

        // Reset all arrows
        var allUp = document.querySelectorAll('[id^="arrow-up-"]');
        var allDown = document.querySelectorAll('[id^="arrow-down-"]');
        allUp.forEach(function(el) { el.classList.remove('active'); });
        allDown.forEach(function(el) { el.classList.remove('active'); });

        // Highlight active arrow
        if (dir === 'asc') {
            document.getElementById('arrow-up-' + colIndex).classList.add('active');
        } else {
            document.getElementById('arrow-down-' + colIndex).classList.add('active');
        }

        currentPage = 1;
        renderPage();
    }

    function updateTable() {
        currentPage = 1;
        renderPage();
    }

    function searchTable() {
        var query = document.getElementById('search').value.toLowerCase();
        var rows = document.querySelectorAll('#dataTable tbody tr');
        for (var i = 0; i < rows.length; i++) {
            var firstCell = rows[i].getElementsByTagName('td')[0];
            if (firstCell) {
                var text = firstCell.textContent.toLowerCase();
                rows[i].setAttribute('data-filtered', text.indexOf(query) === -1 ? 'true' : 'false');
            }
        }
        currentPage = 1;
        renderPage();
    }

    function renderPage() {
        var entries = parseInt(document.getElementById('entries').value);
        var allRows = document.querySelectorAll('#dataTable tbody tr');
        var visibleRows = [];
        for (var i = 0; i < allRows.length; i++) {
            if (allRows[i].getAttribute('data-filtered') === 'true') {
                allRows[i].classList.add('hidden');
            } else {
                visibleRows.push(allRows[i]);
            }
        }
        var totalRows = visibleRows.length;
        var totalPages = Math.ceil(totalRows / entries) || 1;
        var start = (currentPage - 1) * entries;
        var end = start + entries;

        for (var i = 0; i < visibleRows.length; i++) {
            if (i >= start && i < end) {
                visibleRows[i].classList.remove('hidden');
            } else {
                visibleRows[i].classList.add('hidden');
            }
        }

        document.getElementById('info').textContent =
            'Showing ' + (totalRows > 0 ? start + 1 : 0) + ' to ' + Math.min(end, totalRows) + ' of ' + totalRows + ' entries';
        document.getElementById('pageInfo').textContent =
            'Page ' + currentPage + ' of ' + totalPages;
    }

    function nextPage() {
        var entries = parseInt(document.getElementById('entries').value);
        var totalRows = document.querySelectorAll('#dataTable tbody tr').length;
        if (currentPage < Math.ceil(totalRows / entries)) {
            currentPage++;
            renderPage();
        }
    }

    function prevPage() {
        if (currentPage > 1) {
            currentPage--;
            renderPage();
        }
    }

    updateTable();
</script>
